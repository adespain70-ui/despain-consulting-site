title: DeSpain Consulting
description: Removing friction from your business with AI-powered systems that actually fit how you work.
url: "https://despain-consulting.com"
baseurl: ""
lang: en_US
logo: /assets/images/logo.png

# SEO / social previews (used by jekyll-seo-tag)
author: Anne DeSpain
social:
  name: DeSpain Consulting
  links:
    - https://www.linkedin.com/in/annedespain/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Build settings
markdown: kramdown
permalink: pretty

# Collections for easy content management
collections:
  ventures:
    output: true
    permalink: /ventures/:name/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      image: /assets/images/og-default.png
  - scope:
      path: ""
      type: "ventures"
    values:
      layout: "venture"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
