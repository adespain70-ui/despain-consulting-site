<section class="cta-band">
  <div class="container">
    <p class="cta-band-headline">{{ include.headline | default: "Ready to see where AI fits your business?" }}</p>
    <p class="cta-band-sub">{{ include.sub | default: "Start with a 30-minute AI Opportunity Audit. If you don't walk away with at least three actionable opportunities, it's free." }}</p>
    <div class="cta-band-actions">
      <a href="{{ '/services' | relative_url }}" class="btn btn-primary">Book an AI Opportunity Audit</a>
      <a href="{{ '/contact' | relative_url }}" class="btn btn-ghost">Or send a note first</a>
    </div>
  </div>
</section>
